name: 'Preview: Teardown'

# Tears down the per-PR preview instance deployed by preview-deploy.yml.
#
# This is a separate workflow on pull_request_target (not a closed-type job
# in preview-deploy.yml) because this repo auto-deletes merged head branches,
# and GitHub cancels a plain pull_request run when its head branch disappears
# — so a same-workflow teardown gets cancelled by the very merge that
# triggers it (observed live on PR #397). pull_request_target runs in the
# base-repo context and survives the branch deletion. It never checks out PR
# code, so exposing repo secrets to it is safe.

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: preview-teardown-pr-${{ github.event.pull_request.number }}

permissions:
  deployments: write # deactivate the per-PR GitHub deployment environment
  packages: write # delete this PR's preview image versions from GHCR

env:
  KUBE_NAMESPACE: slate
  ENVIRONMENT_NAME: pr-${{ github.event.pull_request.number }}

jobs:

  teardown:
    # fork PRs never got a preview deployed (see preview-deploy.yml)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:

    - name: Configure kubectl
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG_BASE64 }}
      run: |
        mkdir -p ~/.kube
        printf '%s' "${KUBE_CONFIG_DATA}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
        kubectl config set-context --current --namespace="${KUBE_NAMESPACE}"

    - name: Delete preview instance
      run: |
        kubectl delete deployment,service,ingress \
          -l app.kubernetes.io/instance="${ENVIRONMENT_NAME}" \
          --ignore-not-found
        # cert-manager's ingress-shim removes its Certificate with the
        # ingress but leaves the issued secret behind
        kubectl delete secret "${ENVIRONMENT_NAME}-tls" --ignore-not-found

    # preview-deploy.yml pushes ghcr.io/<repo>:pr-<n>-<shortsha> on every PR
    # sync and nothing else ever deletes them — clean up this PR's tags here.
    # Only versions whose tags ALL carry the exact "pr-<n>-" prefix are
    # deleted; anything else (release tags, other PRs' previews, untagged
    # layers/attestations) is left alone. A PR that never deployed a preview
    # (or a repeat teardown) finds no package or no matching versions — both
    # are fine, not failures.
    - name: Delete preview image versions from GHCR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PACKAGE_ORG: ${{ github.repository_owner }}
        PACKAGE_NAME: ${{ github.event.repository.name }}
        TAG_PREFIX: pr-${{ github.event.pull_request.number }}-
      run: |
        set -euo pipefail

        if ! versions="$(gh api --paginate \
          "/orgs/${PACKAGE_ORG}/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
          2>/dev/null)"; then
          echo "container package not found — nothing to clean up"
          exit 0
        fi

        version_ids="$(jq -r --arg prefix "${TAG_PREFIX}" '
          .[]
          | select(
              (.metadata.container.tags | length) > 0
              and all(.metadata.container.tags[]; startswith($prefix))
            )
          | .id
        ' <<< "${versions}")"

        if [ -z "${version_ids}" ]; then
          echo "no ${TAG_PREFIX}* image versions to clean up"
          exit 0
        fi

        for version_id in ${version_ids}; do
          echo "deleting package version ${version_id}"
          gh api --method DELETE \
            "/orgs/${PACKAGE_ORG}/packages/container/${PACKAGE_NAME}/versions/${version_id}"
        done

    - name: Deactivate GitHub deployment environment
      uses: bobheadxi/deployments@v1
      with:
        step: deactivate-env
        token: ${{ secrets.GITHUB_TOKEN }}
        env: ${{ env.ENVIRONMENT_NAME }}
