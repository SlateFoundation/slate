name: 'Preview: Deploy'

# PR-preview deploys have been failing on every run since the
# emergence-cms-layer modernization removed the skeleton-v2 holosource the
# helm-chart holobranch composites from — and the chart targets the retired
# Habitat runtime images besides. Manual-only until previews are rebuilt on
# the container runtime; see #385.
on:
  workflow_dispatch:

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  deployments: write

jobs:
  preview-deploy:
    runs-on: ubuntu-latest
    steps:

    - uses: EmergencePlatform/php-runtime@github-actions/deploy-site-preview/v1
      id: deploy-site-preview
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        kube-config: ${{ secrets.KUBECONFIG_BASE64 }}
        kube-namespace: slate
        kube-hostname: slate.sandbox.k8s.jarv.us
