name: Quality

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  quality:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Fetch composed-framework analysis context
        run: script/fetch-analysis-context

      - name: PHP syntax lint
        run: >
          find php-classes php-migrations event-handlers php-config
          data-exporters site-root -name '*.php' -print0
          | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Rector (dry-run)
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Psalm (taint analysis)
        run: vendor/bin/psalm --taint-analysis --no-progress --threads=4

      - name: PHP-CS-Fixer (check)
        run: vendor/bin/php-cs-fixer check --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'

  eslint:
    name: ESLint (SlateAdmin)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Correctness rules gate at error level; legacy-style rules are
      # warnings via sencha-workspace/SlateAdmin/.eslintrc.js (see its
      # ratchet note). Warnings are reported but don't fail the job.
      - name: ESLint
        run: >
          npx --yes eslint@8.57.0
          --no-error-on-unmatched-pattern
          'sencha-workspace/SlateAdmin/app/**/*.js'
          'sencha-workspace/SlateAdmin/overrides/**/*.js'
          'sencha-workspace/SlateAdmin/app.js'
