name: 'Test: End-to-end'

on: pull_request

permissions:
  contents: write # hologit lens-cache push to origin (HOLO_CACHE_TO)

env:
  HOLO_CACHE_FROM: origin
  HOLO_CACHE_TO: origin

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install hologit
      run: npm install -g hologit

    # hologit lens jobs record their results as commits
    - name: Configure git identity
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'

    # The PHP-8 runtime image context lives beside the skeleton it pairs
    # with; only docker/ is used from this checkout — the cypress workspace
    # is composed via hologit from the pinned skeleton-v3 holosource instead
    - name: Checkout skeleton-v3 (runtime image context)
      uses: actions/checkout@v7
      with:
        repository: EmergencePlatform/skeleton-v3
        path: .skeleton-v3

    - name: Project site tree (emergence-site, lensed)
      run: |
        git holo project emergence-site --fetch --lens | tee /tmp/holo-project.out
        TREE="$(tail -1 /tmp/holo-project.out)"
        if [ -z "${TREE}" ] || ! git cat-file -e "${TREE}^{tree}" 2>/dev/null; then
          echo "::error::hologit projection failed or produced no tree (got: '${TREE}')"
          exit 1
        fi
        echo "projected: ${TREE}"
        mkdir -p .skeleton-v3/docker/.build/site
        git archive "${TREE}" | tar -x -C .skeleton-v3/docker/.build/site

    # composer_auth: composer update resolves php-core from a VCS repo and
    # gets rate-limited without a GitHub token
    - name: Build site image
      run: |
        printf '{"github-oauth": {"github.com": "%s"}}\n' '${{ secrets.GITHUB_TOKEN }}' > "${RUNNER_TEMP}/composer-auth.json"
        docker build --secret id=composer_auth,src="${RUNNER_TEMP}/composer-auth.json" -t slate-e2e .skeleton-v3/docker

    # ASSUME_HTTPS=0: this container serves plain HTTP; port 80 because the
    # app's absolute redirects drop nonstandard ports, which would break
    # Cypress same-origin checks
    - name: Start site container
      run: |
        docker run -d --name slate-e2e -p 127.0.0.1:80:80 \
          -e SITE_HANDLE=emergence-site -e ASSUME_HTTPS=0 slate-e2e
        echo -n 'waiting for first boot (bundled MySQL init)'
        for i in $(seq 1 36); do
          sleep 5
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost/ || true)"
          [ "${code}" = 200 ] && exit 0
          echo -n .
        done
        echo 'site container failed to serve'
        docker logs slate-e2e
        exit 1

    - name: Project cypress workspace
      run: |
        WS_TREE="$(git holo project cypress-workspace | tail -1)"
        echo "projected: ${WS_TREE}"
        mkdir -p "${RUNNER_TEMP}/cypress-workspace"
        git archive "${WS_TREE}" | tar -x -C "${RUNNER_TEMP}/cypress-workspace"

    - name: Run Cypress
      working-directory: ${{ runner.temp }}/cypress-workspace
      run: |
        npm ci --no-audit --no-fund
        npx cypress run \
          --config 'baseUrl=http://localhost,retries=2' \
          --env "SITE_CONTAINER=slate-e2e,SITE_REPO=${GITHUB_WORKSPACE},TEST_USER=teacher"

    - name: Upload Cypress screenshots
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: cypress-screenshots
        path: ${{ runner.temp }}/cypress-workspace/cypress/screenshots
        if-no-files-found: ignore

    - name: Upload Cypress videos
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: cypress-videos
        path: ${{ runner.temp }}/cypress-workspace/cypress/videos
        if-no-files-found: ignore

    - name: Collect site crash log
      if: failure()
      run: docker exec slate-e2e cat /tmp/logs/crash.log > "${RUNNER_TEMP}/crash.log" || true

    - name: Upload site crash log
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: site-crash-log
        path: ${{ runner.temp }}/crash.log
        if-no-files-found: ignore
